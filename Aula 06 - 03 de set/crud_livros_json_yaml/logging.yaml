version: 1

formatters:
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detailed
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: app.log
    encoding: utf-8

loggers:
  persistencia_api:
    level: DEBUG
    handlers:
      - console
      - file
    propagate: false

root:
  level: WARNING
  handlers:
    - console
